name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Dos compilaciones a la vez de main podrían publicar releases cruzadas
concurrency:
  group: compilar-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          log-accept-android-sdk-licenses: false

      - name: Dependencias
        run: npm ci

      - name: Revisión del código (ESLint)
        run: npm run lint

      - name: Pruebas de reglas y estado
        run: npm test

      - name: Compilar la web (Vite)
        run: npm run build

      - name: Compilar la versión de Windows (un solo HTML)
        run: |
          npm run build:windows
          cp dist-windows/grimorio.html "grimorio-windows-1.0.${{ github.run_number }}.html"

      - name: Libros incluidos (caché)
        id: libros
        uses: actions/cache@v4
        with:
          path: libros-generados
          key: libros-${{ hashFiles('tools/resources/*.pdf', 'tools/preparar-libros.mjs', 'web/src/domain/**', 'web/public/data/compendio.json', 'web/public/data/vocabulario.json', 'tools/ocr/lecturas/*.json') }}

      - name: Descargar los PDF (Git LFS)
        if: steps.libros.outputs.cache-hit != 'true'
        run: git lfs pull --exclude "tools/resources/*Monstruos*"

      - name: Leer los libros
        if: steps.libros.outputs.cache-hit != 'true'
        run: node --max-old-space-size=6144 tools/preparar-libros.mjs tools/resources libros-generados

      - name: Añadir los libros a la web
        run: mkdir -p www/libros && cp libros-generados/* www/libros/

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      # La clave de firma vive en los secretos del repositorio, nunca en el código (ver docs/auditoria-seguridad.md).
      # Sin ella se para: un APK con otra firma no se puede instalar encima del anterior sin perder los datos.
      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.GRIMORIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto GRIMORIO_KEYSTORE_BASE64. Sigue los pasos de docs/auditoria-seguridad.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grimorio.keystore"

      - name: Compilar
        working-directory: android
        env:
          GRIMORIO_KEYSTORE_FILE: ${{ runner.temp }}/grimorio.keystore
          GRIMORIO_KEYSTORE_PASSWORD: ${{ secrets.GRIMORIO_KEYSTORE_PASSWORD }}
          GRIMORIO_KEY_ALIAS: ${{ secrets.GRIMORIO_KEY_ALIAS }}
          GRIMORIO_KEY_PASSWORD: ${{ secrets.GRIMORIO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Borrar la clave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/grimorio.keystore"

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk "grimorio-1.0.${{ github.run_number }}.apk"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: grimorio
          path: |
            grimorio-*.apk
            grimorio-windows-*.html

      - name: Publicar en Releases (para descargar desde el móvil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Grimorio 1.0.${{ github.run_number }}
          files: |
            grimorio-*.apk
            grimorio-windows-*.html
          make_latest: true
