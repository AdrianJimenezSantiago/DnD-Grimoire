name: Pruebas (development)

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# Las pruebas solo leen el código: el token de GitHub no necesita más
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Dependencias sin vulnerabilidades conocidas (lo que va dentro de la app)
        run: npm audit --omit=dev --audit-level=high

      - name: Revisión del código (ESLint)
        run: npm run lint

      - name: Pruebas de reglas, clases y estado
        run: npm test

      - name: Compilar la web (Vite)
        run: npm run build

      - name: Compilar la versión de Windows (un solo HTML)
        run: npm run build:windows
