name: Pruebas (development)

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Revisión del código (ESLint)
        run: npm run lint

      - name: Pruebas de reglas, clases y estado
        run: npm test

      - name: Compilar la web (Vite)
        run: npm run build

      - name: Compilar la versión de Windows (un solo HTML)
        run: npm run build:windows
